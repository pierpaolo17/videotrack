<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-labelledby="title">
  <title id="title">VideoTrack</title>
  <defs>
    <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B86F8" />
      <stop offset="100%" stop-color="#254EDB" />
    </linearGradient>
    <linearGradient id="white3d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="greenGlossy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="30%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF566" />
      <stop offset="100%" stop-color="#FFD600" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
      <feOffset in="blur" dx="0" dy="8" result="offsetBlur" />
      <feFlood flood-color="#1E3A8A" flood-opacity="0.3" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="32" y="20" width="448" height="370" rx="90" fill="url(#blueGrad2)" filter="url(#softShadow)" />
  <path d="M 205 115 C 220 105, 240 105, 255 115 L 360 190 C 375 200, 375 225, 360 235
           L 255 310 C 240 320, 220 320, 205 310 C 190 300, 180 280, 180 260 L 180 165
           C 180 145, 190 125, 205 115 Z"
        fill="url(#white3d)" filter="url(#softShadow)" />
  <rect x="32" y="420" width="340" height="46" rx="23" fill="#E5E7EB" opacity="0.6"
        stroke="#FFFFFF" stroke-width="2" />
  <rect x="32" y="420" width="210" height="46" rx="23" fill="url(#greenGlossy)" />
  <path d="M 120,422 L 126,436 L 141,438 L 130,449 L 133,464 L 120,456 L 107,464
           L 110,449 L 99,438 L 114,436 Z"
        fill="url(#starGrad)" stroke="#F59E0B" stroke-width="1.5" stroke-linejoin="round"
        filter="url(#softShadow)" />
  <g filter="url(#softShadow)">
    <rect x="390" y="410" width="90" height="66" rx="20" fill="url(#metalGrad)"
          stroke="#FFFFFF" stroke-width="3" />
    <path d="M 418 443 L 432 455 L 452 431" fill="none" stroke="#4B5563" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
