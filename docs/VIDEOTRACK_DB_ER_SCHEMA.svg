  <style>
    .background{fill:#f7f9fc} .title{font:500 30px system-ui,sans-serif;fill:#172033} .subtitle{font:400 16px system-ui,sans-serif;fill:#526174}
    .section{font:500 19px system-ui,sans-serif;fill:#172033} .entity rect{stroke:#6b7a90;stroke-width:1.5} .entity line{stroke:#6b7a90}
    .entity.core rect{fill:#fff4d6} .entity.plugin rect{fill:#e7f1ff} .entity.child rect{fill:#eaf8f3}
