<title id="title">Schema ER VideoTrack e integrazioni Moodle core</title>
<desc id="desc">Sette tabelle VideoTrack con 22 foreign key XMLDB stabili, due riferimenti applicativi condizionali e integrazioni Moodle core.</desc>
<defs>
